---
- name: Setup Application Services
  hosts: dockerhost
  become: true

  vars_files:
    - _vars_common.yml

  tasks:
    # --- WHOAMI ---
    - name: Sync Whoami
      synchronize:
        src: "../../dockerhost/services/whoami/"
        dest: "{{ base_dir }}/whoami/"
        recursive: true

    - name: Start Whoami
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}/whoami"
        state: present

    # --- NOSTR ---
    - name: Sync Nostr Stack
      synchronize:
        src: "../../dockerhost/services/nostr/"
        dest: "{{ base_dir }}/nostr/"
        delete: true
        recursive: true
        rsync_opts:
          - "--chmod=D0755,F0644"
          - "--chown={{ ansible_user }}:{{ ansible_user }}"
          - "--exclude=tor-keys/**"

    - name: Corrigir permissões da pasta Tor Keys
      file:
        path: "{{ base_dir }}/nostr/tor-keys"
        state: directory
        owner: "root"
        group: "root"
        mode: '0700'

    - name: Start Nostr Stack
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}/nostr"
        state: present

    # --- VAULTWARDEN ---
    - name: Sync Vaultwarden
      synchronize:
        src: "../../dockerhost/services/vaultwarden/"
        dest: "{{ base_dir }}/vaultwarden/"
        recursive: true
        rsync_opts:
          - "--exclude=.env"
          - "--exclude=data/"

    - name: Gerar .env do Vaultwarden
      copy:
        dest: "{{ base_dir }}/vaultwarden/.env"
        content: |
          ADMIN_TOKEN={{ vaultwarden_admin_token }}
        owner: fajre
        group: docker
        mode: '0600'
        force: true

    - name: Start Vaultwarden
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}/vaultwarden"
        state: present

    # --- ACTUAL BUDGET ---
    - name: Sync Actual Budget
      synchronize:
        src: "../../dockerhost/services/actualbudget/"
        dest: "{{ base_dir }}/actualbudget/"
        recursive: true
        rsync_opts:
          - "--chmod=D0755,F0644"
          - "--chown={{ ansible_user }}:{{ ansible_user }}"
          - "--exclude=data/"

    - name: Garantir diretório de dados do Actual Budget
      file:
        path: "{{ base_dir }}/actualbudget/data"
        state: directory
        mode: '0755'
        owner: "root"
        group: "root"

    - name: Start Actual Budget
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}/actualbudget"
        state: present

    # --- SYNCTHING ---
    - name: Sync Syncthing Config
      synchronize:
        src: "../../dockerhost/services/syncthing/"
        dest: "{{ base_dir }}/syncthing/"
        recursive: true
        rsync_opts:
          - "--chmod=D0755,F0644"
          - "--chown={{ ansible_user }}:{{ ansible_user }}"
          - "--exclude=config/" # Preserva configs geradas pelo app

    - name: Garantir permissões na pasta de Config
      file:
        path: "{{ base_dir }}/syncthing/config"
        state: directory
        owner: "1000" # usuário fajre
        group: "1000"
        mode: '0755'
        recurse: true

    - name: Garantir permissões no Mountpoint de Dados
      file:
        path: "/mnt/syncthing"
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'

    - name: Start Syncthing
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}/syncthing"
        state: present

    # --- FILE BROWSER ---
    - name: Sync File Browser
      synchronize:
        src: "../../dockerhost/services/filebrowser/"
        dest: "{{ base_dir }}/filebrowser/"
        recursive: true
        rsync_opts:
          - "--chmod=D0755,F0644"
          - "--chown={{ ansible_user }}:{{ ansible_user }}"
          - "--exclude=data/"
          - "--exclude=config/"

    - name: Garantir diretórios e permissões do File Browser
      file:
        path: "{{ item }}"
        state: directory
        owner: "1000" # Crucial para o container conseguir criar o filebrowser.db
        group: "1000"
        mode: '0755'
      loop:
        - "{{ base_dir }}/filebrowser/data"
        - "{{ base_dir }}/filebrowser/config"

    - name: Start File Browser
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}/filebrowser"
        state: present

    # --- MINECRAFT ---
    - name: Sync Minecraft
      synchronize:
        src: "../../dockerhost/services/minecraft/"
        dest: "{{ base_dir }}/minecraft/"
        recursive: true
        rsync_opts:
          - "--chmod=D0755,F0644"
          - "--chown={{ ansible_user }}:{{ ansible_user }}"
          - "--exclude=data/"

    - name: Garantir diretório de dados do Minecraft
      file:
        path: "{{ base_dir }}/minecraft/data"
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'

    - name: Start Minecraft
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}/minecraft"
        state: present

    # --- SPEEDTEST TRACKER ---
    - name: Sync Speedtest Tracker
      synchronize:
        src: "../../dockerhost/services/speedtest-tracker/"
        dest: "{{ base_dir }}/speedtest-tracker/"
        recursive: true
        rsync_opts:
          - "--chmod=D0755,F0644"
          - "--chown={{ ansible_user }}:{{ ansible_user }}"
          - "--exclude=.env"
          - "--exclude=data/"

    - name: Garantir diretório de dados do Speedtest Tracker
      file:
        path: "{{ base_dir }}/speedtest-tracker/data"
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'

    - name: Gerar .env do Speedtest Tracker
      copy:
        dest: "{{ base_dir }}/speedtest-tracker/.env"
        content: |
          APP_KEY={{ speedtest_app_key }}
          APP_URL=https://speedtest-tracker.home
          ASSET_URL=https://speedtest-tracker.home
        owner: "1000"
        group: "1000"
        mode: '0600'
        force: true

    - name: Start Speedtest Tracker
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}/speedtest-tracker"
        state: present

    # --- SHELLFOLIO (TOR PORTFOLIO) ---
    - name: Sync Shellfolio
      synchronize:
        src: "../../dockerhost/services/shellfolio-onion/"
        dest: "{{ base_dir }}/shellfolio-onion/"
        recursive: true
        rsync_opts:
          - "--chmod=D0755,F0644"
          - "--chown={{ ansible_user }}:{{ ansible_user }}"
          - "--exclude=tor-keys/**"
          - "--exclude=app/**"
          - "--exclude=repo.git/**"

    - name: Inicializar repositorio Git Bare (shellfolio-onion) # noqa command-instead-of-module
      command: git init --bare repo.git
      args:
        chdir: "{{ base_dir }}/shellfolio-onion/"
        creates: "{{ base_dir }}/shellfolio-onion/repo.git/HEAD"
      become: true
      become_user: "{{ ansible_user }}"

    - name: Instalar Git Hook (post-receive)
      copy:
        src: "{{ base_dir }}/shellfolio-onion/post-receive"
        dest: "{{ base_dir }}/shellfolio-onion/repo.git/hooks/post-receive"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Garantir pasta app/dist pre-criada (Evita root via Docker)
      file:
        path: "{{ base_dir }}/shellfolio-onion/app/dist"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Corrigir permissoes da pasta Tor Keys (Shellfolio)
      file:
        path: "{{ base_dir }}/shellfolio-onion/tor-keys"
        state: directory
        owner: "root"
        group: "root"
        mode: '0700'

    - name: Start Shellfolio Stack
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}/shellfolio-onion"
        state: present

    # --- FRESHRSS ---
    - name: Sync FreshRSS
      synchronize:
        src: "../../dockerhost/services/freshrss/"
        dest: "{{ base_dir }}/freshrss/"
        delete: true
        recursive: true
        rsync_opts:
          - "--chmod=D0755,F0644"
          - "--chown={{ ansible_user }}:{{ ansible_user }}"
          - "--exclude=.env"
          - "--exclude=data/"
          - "--exclude=extensions/"

    - name: Garantir diretórios persistentes do FreshRSS
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ base_dir }}/freshrss/data/app"
          owner: "33"
          group: "33"
          mode: "0750"

        - path: "{{ base_dir }}/freshrss/data/postgres"
          owner: "70"
          group: "70"
          mode: "0700"

        - path: "{{ base_dir }}/freshrss/extensions"
          owner: "{{ ansible_user }}"
          group: "{{ ansible_user }}"
          mode: "0755"

    - name: Listar extensões instaladas do FreshRSS
      ansible.builtin.find:
        paths: "{{ base_dir }}/freshrss/extensions"
        file_type: directory
        recurse: false
      register: freshrss_installed_extensions

    - name: Remover extensões FreshRSS não declaradas
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ freshrss_installed_extensions.files }}"
      when: (item.path | basename) not in (freshrss_extensions | map(attribute='name') | list)

    - name: Instalar extensões FreshRSS com repositório próprio
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ base_dir }}/freshrss/extensions/{{ item.name }}"
        version: "{{ item.version }}"
        force: true
        update: true
      loop: "{{ freshrss_extensions }}"
      when: item.subdir is not defined
      become: true
      become_user: "{{ ansible_user }}"

    - name: Garantir cache de fontes das extensões FreshRSS
      ansible.builtin.file:
        path: "/var/cache/freshrss-extensions"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Baixar repositórios de extensões FreshRSS com subdiretório
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "/var/cache/freshrss-extensions/{{ item.name }}"
        version: "{{ item.version }}"
        force: true
        update: true
      loop: "{{ freshrss_extensions }}"
      when: item.subdir is defined
      become: true
      become_user: "{{ ansible_user }}"

    - name: Sincronizar extensões FreshRSS vindas de subdiretórios
      ansible.posix.synchronize:
        src: "/var/cache/freshrss-extensions/{{ item.name }}/{{ item.subdir }}/"
        dest: "{{ base_dir }}/freshrss/extensions/{{ item.name }}/"
        delete: true
        recursive: true
        rsync_opts:
          - "--chmod=D0755,F0644"
          - "--chown={{ ansible_user }}:{{ ansible_user }}"
      loop: "{{ freshrss_extensions }}"
      when:
        - item.subdir is defined
        - not ansible_check_mode
      delegate_to: "{{ inventory_hostname }}"

    - name: Garantir ownership das extensões FreshRSS
      ansible.builtin.file:
        path: "{{ base_dir }}/freshrss/extensions/{{ item.name }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true
      loop: "{{ freshrss_extensions }}"

    - name: Gerar .env do FreshRSS
      copy:
        dest: "{{ base_dir }}/freshrss/.env"
        content: |
          BASE_URL=https://freshrss.home
          DB_HOST=db
          DB_BASE=freshrss
          DB_USER=freshrss
          DB_PASSWORD={{ freshrss_db_password }}
          FRESHRSS_ADMIN_PASSWORD={{ freshrss_admin_password }}
          FRESHRSS_VERSION={{ freshrss_version }}
          YTDLP_VERSION={{ freshrss_ytdlp_version }}
          DENO_VERSION={{ freshrss_deno_version }}
        owner: "1000"
        group: "1000"
        mode: "0600"
        force: true
      no_log: true

    - name: Start FreshRSS
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}/freshrss"
        state: present
        build: always

    # --- MEDIA STACK ---
    - name: Sync Media Stack
      synchronize:
        src: "../../dockerhost/services/media/"
        dest: "{{ base_dir }}/media/"
        delete: true
        recursive: true
        rsync_opts:
          - "--chmod=D0755,F0644"
          - "--chown={{ ansible_user }}:{{ ansible_user }}"
          - "--exclude=.env"
          - "--exclude=config/"
          - "--exclude=cache/"

    - name: Garantir diretórios persistentes da stack de mídia
      file:
        path: "{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0775"
      loop:
        - "{{ base_dir }}/media/config"
        - "{{ base_dir }}/media/config/qbittorrent"
        - "{{ base_dir }}/media/config/prowlarr"
        - "{{ base_dir }}/media/config/radarr"
        - "{{ base_dir }}/media/config/sonarr"
        - "{{ base_dir }}/media/config/bazarr"
        - "{{ base_dir }}/media/config/jellyfin"
        - "{{ base_dir }}/media/config/seerr"
        - "{{ base_dir }}/media/config/flaresolverr"
        - "{{ base_dir }}/media/cache"
        - "{{ base_dir }}/media/cache/jellyfin"

    - name: Verificar mountpoint da mídia
      command: mountpoint -q /mnt/media
      changed_when: false

    - name: Garantir diretórios da biblioteca
      file:
        path: "{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0775"
      loop:
        - "/mnt/media/data"
        - "/mnt/media/data/torrents"
        - "/mnt/media/data/torrents/movies"
        - "/mnt/media/data/torrents/tv"
        - "/mnt/media/data/media"
        - "/mnt/media/data/media/movies"
        - "/mnt/media/data/media/tv"

    - name: Gerar .env da stack de mídia
      copy:
        dest: "{{ base_dir }}/media/.env"
        content: |
          VPN_WIREGUARD_PRIVATE_KEY={{ media_vpn_wireguard_private_key }}
        owner: "1000"
        group: "1000"
        mode: "0600"
        force: true
      no_log: true

    - name: Start Media Stack
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}/media"
        state: present
