services:
  filebrowserquantum:
    image: gtstef/filebrowser:1.5.6-stable
    container_name: filebrowserquantum
    restart: unless-stopped
    user: "1000:1000"

    environment:
      FILEBROWSER_CONFIG: /home/filebrowser/config/config.yaml
      FILEBROWSER_ADMIN_PASSWORD: ${FILEBROWSER_ADMIN_PASSWORD}

    volumes:
      # Mesmos dados usados pelo Syncthing
      - /mnt/syncthing:/srv

      # Estado persistente do Quantum: database.db + cache
      - ./data:/home/filebrowser/data

      # Configuração declarativa gerenciada pelo Git/Ansible
      - ./config:/home/filebrowser/config:ro

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.filebrowserquantum.rule=Host(`filebrowserquantum.home`)"
      - "traefik.http.routers.filebrowserquantum.entrypoints=websecure"
      - "traefik.http.routers.filebrowserquantum.tls=true"

      - "traefik.http.routers.filebrowserquantum.middlewares=authentik@docker"

      - "traefik.http.services.filebrowserquantum.loadbalancer.server.port=80"
      - "traefik.http.services.filebrowserquantum.loadbalancer.passhostheader=true"

networks:
  proxy:
    external: true
