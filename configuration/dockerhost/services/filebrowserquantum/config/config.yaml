server:
  port: 80
  baseURL: "/"
  externalUrl: "https://filebrowserquantum.home"

  database: "/home/filebrowser/data/database.db"
  cacheDir: "/home/filebrowser/data/tmp"

  disableWebDAV: true

  filesystem:
    createFilePermission: "644"
    createDirectoryPermission: "755"

  sources:
    - path: "/srv"
      name: "Syncthing"
      config:
        defaultEnabled: true
        private: true
        readOnly: false

        # Protege arquivos internos do Syncthing como .stfolder e .stversions.
        rules:
          - folderPath: "/"
            ignoreHidden: true

auth:
  adminUsername: admin

  methods:
    password:
      enabled: true
      minLength: 16
      signup: false

http:
  trustedHeaders:
    - "X-Forwarded-Proto"
    - "X-Forwarded-Host"
    - "X-Forwarded-For"
    - "X-Real-IP"
