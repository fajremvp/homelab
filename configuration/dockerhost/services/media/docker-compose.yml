services:
  # VPN GATEWAY
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    environment:
      - TZ=America/Sao_Paulo

      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${VPN_WIREGUARD_PRIVATE_KEY}

      # Usar somente servidores Proton que suportem port forwarding
      - PORT_FORWARD_ONLY=on

      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn

      # Atualiza automaticamente a listening port do qBittorrent com a porta dinâmica recebida da ProtonVPN
      - >-
        VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv
        --retry-connrefused
        --post-data
        "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'

      - >-
        VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv
        --retry-connrefused
        --post-data
        "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'

    networks:
      - media_net
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.home`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.middlewares=authentik@docker"

      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"

  # DOWNLOAD CLIENT
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped

    network_mode: service:gluetun

    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
      - UMASK=002

    volumes:
      - ./config/qbittorrent:/config
      - /mnt/media/data:/data

  # INDEXERS
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - UMASK=002

    volumes:
      - ./config/prowlarr:/config

    networks:
      - media_net
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.home`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.routers.prowlarr.middlewares=authentik@docker"

      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  # MOVIES
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - UMASK=002

    volumes:
      - ./config/radarr:/config
      - /mnt/media/data:/data

    networks:
      - media_net
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.radarr.rule=Host(`radarr.home`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.middlewares=authentik@docker"

      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

  # SERIES
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - UMASK=002

    volumes:
      - ./config/sonarr:/config
      - /mnt/media/data:/data

    networks:
      - media_net
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.sonarr.rule=Host(`sonarr.home`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.routers.sonarr.middlewares=authentik@docker"

      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  # SUBTITLES
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - UMASK=002

    volumes:
      - ./config/bazarr:/config
      - /mnt/media/data:/data

    networks:
      - media_net
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.bazarr.rule=Host(`bazarr.home`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.routers.bazarr.middlewares=authentik@docker"

      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  # MEDIA SERVER
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped

    user: "1000:1000"

    environment:
      - TZ=America/Sao_Paulo

    volumes:
      - ./config/jellyfin:/config
      - ./cache/jellyfin:/cache
      - /mnt/media/data/media:/media:ro

    networks:
      - media_net
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.home`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"

      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  # REQUEST MANAGEMENT
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true

    environment:
      - TZ=America/Sao_Paulo
      - LOG_LEVEL=info
      - PORT=5055

    volumes:
      - ./config/seerr:/app/config

    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

    networks:
      - media_net
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.seerr.rule=Host(`seerr.home`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.routers.seerr.tls=true"
      - "traefik.http.routers.seerr.middlewares=authentik@docker"

      - "traefik.http.services.seerr.loadbalancer.server.port=5055"

  # CLOUDFLARE CHALLENGE SOLVER
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    restart: unless-stopped

    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=America/Sao_Paulo

    volumes:
      - ./config/flaresolverr:/config

    networks:
      - media_net

networks:
  media_net:
    internal: false

  proxy:
    external: true
